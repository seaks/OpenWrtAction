# Description: Build Cache OpenWrt using GitHub Actions
#
# ============================================================================
# 职责：只负责把 tools / toolchain 的产物压成缓存推到 GHCR，不出固件
#       真正的编译 workflow 从这里 pull，Base 阶段从 1~1.5h 降到 2~3min
#
#   job_init                  读 platforms.sh，产出编译矩阵 + 源码矩阵
#      ↓
#   job_source_init           并行：clone → part1/2/3 → defconfig → 打包源码 artifact
#      ↓
#   job_cache_compile_and_upload  并行：解包 → 恢复缓存 → 编译 Base → 有变化才推
#      ↓
#   rerun-failed-jobs         失败且 attempt<3 → Retry_Failure_Jobs.yml
#
# 缓存命名：openwrt-base-cache-<source_code_platform>-<platform>:latest
#   ⚠️ 必须带源码平台：immortalwrt_master / immortalwrt_snapshot / lede 的
#      toolchain 不通用，只按固件平台命名会互相覆盖，构建端拉到的就是错的
#
# 缓存原理（易误解，写清楚）：
#   Checkpoint: tar | zstd | split  →  得到单个 zstd 流的 N 个连续片段
#   每片一个 layer，Dockerfile 用 COPY layerN /  →  平铺到镜像根目录
#   docker export 输出的是「平铺合并后的单个 tar 流」，不是 save 的分层 tar
#   所以 cat 拼回的仍是同一个 zstd 流，tar -I zstd 可直接解（不需要 zstdcat）
#
# 目录约定（已核对仓库现状，命名一一对应，无需额外映射字段）：
#   diy_script/<source_code_platform>_dependence  依赖清单
#   diy_script/<source_code_platform>_diy/        diy-part1/2/3.sh
#   config/<source_code_platform>/<platform>.config
#
#   job_init 会自检前两项，缺一个就早失败，
#   比在多个编译 job 里各挂一次省时间
# ============================================================================

name: Cache_Multi_Platform(V6)

on:
  repository_dispatch:
    types: [openwrt_cache_update_v6]
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      force_rebuild:
        description: 'Build from scratch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: write

env:
  GIT_REF_NAME: ${{ github.head_ref || github.ref_name }}
  MAX_PUSH_RETRIES: 10

jobs:

  # ==========================================================================
  # 1. 初始化：读 platforms.sh + 依赖清单 / diy 目录自检
  # ==========================================================================
  job_init:
    runs-on: ubuntu-latest
    name: Init
    outputs:
      platforms: ${{ steps.read-platforms.outputs.matrix }}
      platforms_source: ${{ steps.read-platforms.outputs.source_matrix_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}

      - name: Read Platforms From File
        id: read-platforms
        run: |
          set -e
          bash compile_script/platforms.sh

      # 取值必须来自 step 的 output，不是 shell 变量
      #   platforms.sh 写的是 $GITHUB_OUTPUT 的 source_matrix_json，
      #   读 $SOURCE_MATRIX_JSON 会拿到空值 → 循环零次 → 自检形同虚设
      - name: Validate Dependence Files
        run: |
          set -e
          SOURCE_MATRIX='${{ steps.read-platforms.outputs.source_matrix_json }}'

          if [ -z "$SOURCE_MATRIX" ]; then
            echo "!!! source_matrix_json 为空，platforms.sh 没有写入 GITHUB_OUTPUT" >&2
            exit 1
          fi

          echo "---- 校验 diy_script/<platform>_dependence 与 _diy/ ----"
          # 先落临时文件：管道里的 while 跑在子 shell，
          # 里面的 exit 传不出来，step 会假成功
          jq -r '.[].source_code_platform' <<< "$SOURCE_MATRIX" > /tmp/source_platforms.txt

          miss=0
          while IFS= read -r sp; do
            [ -z "$sp" ] && continue
            if [ -f "diy_script/${sp}_dependence" ] && [ -d "diy_script/${sp}_diy" ]; then
              echo "  ok   : ${sp}_dependence + ${sp}_diy/"
            else
              [ -f "diy_script/${sp}_dependence" ] || echo "  MISS : diy_script/${sp}_dependence" >&2
              [ -d "diy_script/${sp}_diy" ]        || echo "  MISS : diy_script/${sp}_diy/" >&2
              miss=1
            fi
          done < /tmp/source_platforms.txt

          if [ "$miss" -ne 0 ]; then
            echo "!!! 有源码平台缺少依赖清单或 diy 目录，请先补齐" >&2
            exit 1
          fi
          echo "✅ 所有源码平台的依赖清单与 diy 目录均存在"

      # config 路径同样校验一遍，拼错大小写在这里就暴露
      - name: Validate Config Files
        run: |
          set -e
          MATRIX='${{ steps.read-platforms.outputs.matrix }}'
          miss=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            cfg="${line%|*}"
            if [ -e "$cfg" ]; then
              echo "  ok   : $cfg"
            else
              echo "  MISS : $cfg" >&2
              miss=1
            fi
          done < <(echo "$MATRIX" | jq -r '.[] | "\(.value.CONFIGS)/\(.platform).config"')

          if [ "$miss" -ne 0 ]; then
            echo "!!! 有平台缺少 .config，请检查 config/ 目录与 platforms.sh 里的平台名大小写" >&2
            exit 1
          fi
          echo "✅ 所有平台的 .config 均存在"


  # ==========================================================================
  # 2. 源码初始化（按源码平台并行，每个源码平台只跑一次）
  #    不做 defconfig 回推，避免和主构建 workflow 的 Git 提交撞车
  # ==========================================================================
  job_source_init:
    needs: job_init
    runs-on: ubuntu-latest
    name: Source-Init-${{ matrix.source_code_platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.job_init.outputs.platforms_source) }}
    steps:
      - name: Init System
        id: init
        run: |
          set -e
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir
          cd /workdir
          mkdir -p output                       # ln -sf 需要目标存在
          ln -sf /workdir/output $GITHUB_WORKSPACE/output
          df -hT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}

      - name: Clone Source Code
        working-directory: /workdir
        run: |
          set -e
          git clone -b ${{ matrix.value.REPO_BRANCH }} --single-branch ${{ matrix.value.REPO_URL }} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Run DIY Part 1 Script
        run: |
          set -e
          chmod +x ${{ matrix.value.DIY_P1_SH }}
          cd openwrt
          $GITHUB_WORKSPACE/${{ matrix.value.DIY_P1_SH }}
          echo "feeds_Conf:------------------------"
          cat feeds.conf.default

      - name: Update Feeds
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -a

      - name: Run DIY Part 2 Script
        env:
          GHFU_GITHUB_TOKEN: ${{ secrets.GHFU_GITHUB_TOKEN }}
        run: |
          set -e
          chmod +x ${{ matrix.value.DIY_P2_SH }}
          cd openwrt
          $GITHUB_WORKSPACE/${{ matrix.value.DIY_P2_SH }}

      - name: Install Feeds
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Run DIY Part 3 scripts
        run: |
          chmod +x $GITHUB_WORKSPACE/${{ matrix.value.DIY_P3_SH }} || true
          cd openwrt
          $GITHUB_WORKSPACE/${{ matrix.value.DIY_P3_SH }}

      - name: Generate Source Packages
        working-directory: /workdir
        id: generate_image
        run: |
          set -e
          tar -czf output/output.tar.gz openwrt/
          echo "SOURCE_PATH=$PWD" >> $GITHUB_OUTPUT

      - name: Upload Source To Artifact
        uses: actions/upload-artifact@v7
        if: steps.generate_image.outcome == 'success'
        with:
          name: Source_${{ matrix.source_code_platform }}
          path: ${{ steps.generate_image.outputs.SOURCE_PATH }}/output/output.tar.gz
          overwrite: true
          retention-days: 5


  # ==========================================================================
  # 3. 编译 Base 并推缓存（源码平台 × 固件平台 并行）
  #
  #    if 里带上两个 needs 的 result：
  #      只写 always() 的话，job_init 失败也会往下走，
  #      fromJson 拿到空矩阵 → 编译 job 被静默跳过，
  #      整个 workflow 显示绿色，实际什么都没预热
  #
  #    matrix_status：本 job 若已在重试中成功过就直接跳过
  #    fail-fast: false：单个平台失败不牵连其他平台预热
  # ==========================================================================
  job_cache_compile_and_upload:
    needs: [job_init, job_source_init]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && needs.job_init.result == 'success' && needs.job_source_init.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.job_init.outputs.platforms) }}
    name: Build-${{ matrix.source_code_platform }}-${{ matrix.platform }}-Cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}

      - name: Matrix Status
        id: matrix_status
        run: |
          set -e
          chmod +x compile_script/matrix_job_status.sh
          $GITHUB_WORKSPACE/compile_script/matrix_job_status.sh "${{ github.token }}" "${{ github.repository }}" "${{ github.run_id }}" "${{ fromJSON(github.run_attempt) }}" "Build-${{ matrix.source_code_platform }}-${{ matrix.platform }}-Cache"

      - name: Server Info
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          echo "---------------------CPU Info--------------------"
          lscpu
          echo "---------------------RAM Info--------------------"
          free -h

      - name: Initialization Environment
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir
          df -hT

      - name: Free Disk Space
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          echo "==== Disk space before cleanup ===="
          df -hT
          echo "==== Clean disk space begin ===="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "==== Clean disk space complete ===="
          df -hT

      # ---------------------------------------------------------------
      # 安装编译依赖
      #   不用 sudo -E：runner 的 sudoers 有 env_reset，-E 会被忽略并刷警告
      #   改成在 sudo 命令行上显式传 DEBIAN_FRONTEND
      #
      #   curl 退出码用 set +e / set -e 夹住捕获；判断时加引号，
      #   否则 DEP_RC 万一为空会变成 "[ -ne 0 ]" → unary operator expected，
      #   连下面的错误提示都打印不出来
      #
      #   Dpkg::Options 让 tzdata / grub 之类 maintainer script 不弹交互
      # ---------------------------------------------------------------
      - name: Install Packages
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          DEP_URL="https://github.com/seaks/OpenWrtAction/raw/main/diy_script/${{ matrix.source_code_platform }}_dependence"
          set +e
          DEP_LIST=$(curl -fsSL "$DEP_URL")
          DEP_RC=$?
          set -e
          if [ "$DEP_RC" -ne 0 ] || [ -z "$DEP_LIST" ]; then
            echo "!!! 获取依赖清单失败 (rc=$DEP_RC)，平台：${{ matrix.source_code_platform }}" >&2
            exit 1
          fi
          echo "---- 待装依赖 ----"
          echo "$DEP_LIST"
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            $DEP_LIST

      - name: Initialization Directory
        working-directory: /workdir
        id: init_directory
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          mkdir -p openwrt download
          ln -sf /workdir/openwrt   $GITHUB_WORKSPACE/openwrt
          ln -sf /workdir/download $GITHUB_WORKSPACE/download

      # Docker 数据目录迁到 /workdir：根分区仅 ~14GB，装不下缓存镜像
      - name: Relocate Docker to /workdir
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          echo "==== 1. 停止 Docker 服务 ===="
          sudo systemctl stop docker
          echo "==== 2. 迁移数据目录到 /workdir ===="
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          echo "==== 3. 重启 Docker 服务 ===="
          sudo systemctl start docker
          echo "==== 4. 验证 ===="
          docker info | grep "Docker Root Dir"

      - name: Login to GitHub Container Registry
        if: steps.matrix_status.outputs.status != 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download Source From Artifacts
        id: download
        if: steps.matrix_status.outputs.status != 'success'
        uses: actions/download-artifact@v8
        with:
          name: Source_${{ matrix.source_code_platform }}
          path: download

      - name: Extract Pristine Source
        if: steps.matrix_status.outputs.status != 'success'
        working-directory: /workdir
        run: |
          set -e
          tar -xzf download/output.tar.gz
          rm -rf download/output.tar.gz
          sudo chown -R $USER:$GROUPS /workdir/openwrt

      - name: Load Configuration
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          [ -e "${{ matrix.value.CONFIGS }}/${{ matrix.platform }}.config" ] && \
            cp -r "${{ matrix.value.CONFIGS }}/${{ matrix.platform }}.config" openwrt/.config
          cd openwrt
          make defconfig

      # ---------------------------------------------------------------
      # 时间戳还原
      #   artifact 打包会把 mtime 全冲成当下，make 靠 mtime 判断要不要重编
      #   1) 用 git log 把每个文件 mtime 还原成最后提交时间
      #   2) dl/ 一律回拨 2000-01-01：make download 会刷新 tarball mtime，
      #      比 stamp 新就触发重编；回拨到远古即免疫
      #      （PKG_HASH 真变了 stamp 名也变，照样正常重编）
      # ---------------------------------------------------------------
      - name: Git Restore Mtime (True SSoT) And DL Restore Time
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          cd /workdir/openwrt
          echo "==== 遍历所有 Git 仓库并精准还原真实提交时间 ===="
          find . -name ".git" -type d | while read -r gitdir; do
              repo_dir=$(dirname "$gitdir")
              echo "-> 正在处理 Git 仓库: $repo_dir"
              # 子 shell：cd 不污染外层循环
              (
                cd "/workdir/openwrt/$repo_dir" || exit 0
                git log --format=%at --name-only | perl -ane '
                  if (/^(\d+)$/) { $t = $1; }
                  elsif (/^(\S+)$/) {
                    $f = $1;
                    if (-e $f && !-d $f && !$seen{$f}) {
                      utime($t, $t, $f);
                      $seen{$f} = 1;
                    }
                  }'
              )
          done

          find /workdir/openwrt/dl -type f -print0 2>/dev/null | \
            xargs -0 -r touch -t 200001010000
          echo "✅ dl/ 时间戳逆转完成！"

      # ---------------------------------------------------------------
      # 从 GHCR 恢复整个编译缓存
      #
      #   Checkpoint 时 COPY layerN / 会把层内文件平铺到镜像根目录，
      #   所以 export 出来的 tar 里分块直接位于 / 下，无需递归查找
      #
      #   split 切的是「tar | zstd」的单个压缩流，cat 拼回仍是同一个流，
      #   因此 tar -I zstd 可直接解（不是 docker save 那种分层独立压缩）
      #
      #   pipefail：tar 解失败时不能继续 rm 掉分块，保留现场便于排查
      #   sort -V：分块必须按 00,01,02… 顺序拼，shell glob 顺序不保证
      # ---------------------------------------------------------------
      - name: Restore Entire OpenWrt Cache from GHCR
        id: restore_cache
        if: steps.matrix_status.outputs.status != 'success' && fromJSON(github.run_attempt) < 3 && github.event.inputs.force_rebuild != 'true'
        run: |
          set -eo pipefail
          df -hT

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PLATFORM_NAME=$(echo "${{ matrix.source_code_platform }}-${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/openwrt-base-cache-${PLATFORM_NAME}:latest"

          if ! docker pull "$IMAGE_NAME"; then
            echo "No cache found on GHCR. This will be a clean build."
            df -hT
            exit 0
          fi

          echo "==== 发现缓存，开始提取 ===="
          cd /workdir

          docker create --name cache_container "$IMAGE_NAME" /bin/true
          docker export cache_container > cache_exported.tar
          docker rm -f cache_container
          docker rmi -f "$IMAGE_NAME"

          # 分块平铺在镜像根目录，直接提取
          tar -xf cache_exported.tar --wildcards "op_cache_raw_*"
          rm -f cache_exported.tar

          mapfile -t PARTS < <(ls -1 op_cache_raw_* 2>/dev/null | sort -V)

          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "⚠️ 未找到有效缓存分块，转入 clean build"
          else
            echo "==== 合并 ${#PARTS[@]} 个分块并还原到源码树 ===="
            cat "${PARTS[@]}" | tar -I "zstd -T0" -xf - -C /workdir/openwrt/
            rm -f op_cache_raw_*
            echo "✅ 缓存恢复完成！"
          fi

          df -hT

      - name: SSH connection to Actions
        uses: owenthereal/action-upterm@v2
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')

      # ---------------------------------------------------------------
      # 阶段一：编译 Base（tools / toolchain）
      #
      #   ⚠️ download 必须 -j1：
      #      kernel.org / gnu.org / GitHub 会限流，并发容易 429 拖垮整个 make；
      #      这步瓶颈是带宽不是 CPU，串行省不了多少时间，稳定性差别很大
      #
      #   golang / rust / ruby / gettext-full 的 host 工具暂不纳入 Base：
      #      它们随 feeds 版本变化频繁，一旦进缓存，feeds 一更新整块失效，
      #      预热反而变成负担
      #
      #   第 3 次尝试开 V=s 输出详细日志
      # ---------------------------------------------------------------
      - name: Compile Base (Tools, Toolchain)
        id: compile_base
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          cd openwrt
          touch /workdir/base_compilation_marker

          LONG_TIME_TARGETS_DOWNLOAD=(
              "tools/download"
              "toolchain/download"
              # "package/feeds/packages/golang/host/download"
              # "package/feeds/packages/rust/host/download"
              # "package/feeds/packages/ruby/host/download"
              # "package/libs/gettext-full/host/download"
          )
          echo "==== 开始 download ===="
          for target in "${LONG_TIME_TARGETS_DOWNLOAD[@]}"; do
              echo "==== 正在执行 download $target ===="
              make "$target" -j1 || exit 1
              sleep 5
              echo "------------------------"
          done

          LONG_TIME_TARGETS_COMPILE=(
              "tools/compile"
              "toolchain/compile"
              # "package/feeds/packages/golang/host/compile"
              # "package/feeds/packages/rust/host/compile"
              # "package/feeds/packages/ruby/host/compile"
              # "package/libs/gettext-full/host/compile"
          )

          VERBOSE=""
          if [[ ${{ fromJSON(github.run_attempt) }} == 3 ]]; then
              VERBOSE="V=s"
          fi

          echo "==== 开始编译 ===="
          for target in "${LONG_TIME_TARGETS_COMPILE[@]}"; do
              echo "==== 正在执行 compile $target $VERBOSE ===="
              time make "$target" -j$(nproc) $VERBOSE || exit 1
              sleep 5
              echo "------------------------"
          done

      # ---------------------------------------------------------------
      # Checkpoint：Base 有变化才推新缓存
      #   探测：找比 marker 新的 stamp，忽略每次必变但无复用价值的
      #   推送：tar | zstd | split 切 5GB，每块一个 layer 绕开单文件限制
      #
      #   实测两种输出都健康：
      #     没变 → "🎉 Found 0 newer stamp files"
      #     变了 → "⚡ 检测到 N 个新 stamp" + "✅ 分块多层缓存推送完毕"
      # ---------------------------------------------------------------
      - name: Checkpoint Cache (Save Base to GHCR)
        if: steps.matrix_status.outputs.status != 'success' && steps.compile_base.outcome == 'success'
        run: |
          set -e
          echo "==== 智能探测 Base 是否更新 ===="
          cd /workdir

          IGNORE_PATTERN="staging_dir/host/stamp/\.tools_compile_|staging_dir/target-[^/]+/stamp/\.target_prereq$|staging_dir/host/stamp/\.(zstd|flock|libdeflate|pkgconf|xz|tar|patch|m4)_"

          CHANGED_STAMPS=$(find openwrt/build_dir openwrt/staging_dir -type f \
                            -newer /workdir/base_compilation_marker \
                            -path "*/stamp/*" 2>/dev/null | \
                            grep -E -v "$IGNORE_PATTERN" || true)

          CHANGED_BASE=$(echo "$CHANGED_STAMPS" | grep -c . || true)
          echo "--- Found $CHANGED_BASE newer stamp files ---"

          if [ "$CHANGED_BASE" -eq 0 ]; then
              echo "🎉 Base 阶段命中旧缓存，跳过本次 Checkpoint 存档！"
              exit 0
          fi

          echo "$CHANGED_STAMPS"

          echo "==== 回拨 dl/ 时间戳 ===="
          find /workdir/openwrt/dl -type f -print0 2>/dev/null | \
            xargs -0 -r touch -t 200001010000
          echo "✅ dl/ 时间戳逆转完成！"

          echo "⚡ 检测到 $CHANGED_BASE 个新 stamp，触发缓存更新存档..."
          df -hT

          echo "==== 自动修剪冗余版本 ===="
          for linux_dir in openwrt/build_dir/target-*/linux-*/; do
              [ -d "$linux_dir" ] && \
                (cd "$linux_dir" && ls -dt linux-* 2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
          done
          [ -d "openwrt/build_dir" ] && \
            (cd openwrt/build_dir && ls -dt toolchain-* 2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
          if [ -d "openwrt/staging_dir" ]; then
              (cd openwrt/staging_dir && ls -dt target-*   2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
              (cd openwrt/staging_dir && ls -dt toolchain-* 2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
          fi

          echo "==== 打包与 5GB 分块 ===="
          cd /workdir/openwrt
          tar -I "zstd -T0 -10" -cf - build_dir staging_dir dl 2>/dev/null | \
            split -a 3 -d -b 5000M - /workdir/op_cache_raw_

          echo "==== 创建 Layer 隔离目录 ===="
          cd /workdir
          echo "FROM scratch" > Dockerfile
          count=1
          for f in op_cache_raw_*; do
              layer_dir="layer$count"
              mkdir -p "$layer_dir"
              mv "$f" "$layer_dir/"          # 分块移入 layer 目录，COPY 后平铺到镜像根
              echo "COPY $layer_dir /" >> Dockerfile
              count=$((count + 1))
          done

          echo "==== 构建并推送多层镜像 ===="
          df -hT
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PLATFORM_NAME=$(echo "${{ matrix.source_code_platform }}-${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/openwrt-base-cache-${PLATFORM_NAME}:latest"

          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
          echo "✅ 分块多层缓存推送完毕！"

          echo "==== 清理临时数据 ===="
          rm -rf layer* Dockerfile
          docker rmi -f "$IMAGE_NAME" || true
          # system prune -a 已包含 builder / image prune，一条就够
          docker system prune -a -f || true
          echo "✅ 清理完成！"
          df -hT


  # ==========================================================================
  # 4. 收尾：失败自动重试
  # ==========================================================================
  rerun-failed-jobs:
    runs-on: ubuntu-latest
    needs: [job_init, job_source_init, job_cache_compile_and_upload]
    if: failure() && fromJSON(github.run_attempt) < 3 && !cancelled()
    steps:
      - name: Rerun failed jobs in the current workflow
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Retry failed jobs for the ${{ fromJSON(github.run_attempt) }} time, Retry 3 times in total"
          gh workflow run Retry_Failure_Jobs.yml -F run_id=${{ github.run_id }}
