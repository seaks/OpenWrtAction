# Description: Build OpenWrt using GitHub Actions
#
# ============================================================================
# 流程总览
#
#   job_init                  读 platforms.sh，产出编译矩阵 + 源码矩阵
#      ↓
#   job_source_init           并行：clone → part1/2/3 → defconfig → 打包源码
#      ↓                            同时把 config 变更推回仓库
#   job_generate_release_tag  汇总各平台 git log，创建 Release Tag
#      ↓
#   job_compile_and_upload    并行：解包 → 恢复 GHCR 缓存 → 编译 → 上传 Release
#      ↓
#   job_organize_tags         整理 tag，更新 Release 正文
#      ↓
#   rerun-failed-jobs         失败且 attempt<3 → Retry_Failure_Jobs.yml
#   final-execution-jobs      全部成功 → repository_dispatch 通知下游
#
# 缓存：build_dir / staging_dir / dl → zstd 压成 5GB 分块 → 每块一个 docker layer
#       绕过 Artifact 10GB 上限；dl 时间戳回拨 2000 年，防 make 误判重编
#
# 缓存恢复原理：
#   Checkpoint: tar | zstd | split  →  得到单个 zstd 流的 N 个连续片段
#   每片一个 layer，Dockerfile 用 COPY layerN /  →  平铺到镜像根目录
#   docker export 输出的是「平铺合并后的单个 tar 流」，不是 save 的分层 tar
#   所以 cat 拼回的仍是同一个 zstd 流，tar -I zstd 可直接解（不需要 zstdcat）
#
#   实测：源码与 .config 未变时 Checkpoint 报 "Found 0 newer stamp files"，
#         Base 阶段从 1~1.5h 降到 2~3min，链路已验证可用
# ============================================================================

name: Build_Multi_Platform(V6)

on:
  repository_dispatch:
    types: [openwrt_source_update_v6]
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      force_rebuild:
        description: 'Build from scratch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: write

env:
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  GIT_REF_NAME: ${{ github.head_ref || github.ref_name }}
  MAX_PUSH_RETRIES: 10

jobs:

  # ==========================================================================
  # 1. 初始化：读 platforms.sh
  # ==========================================================================
  job_init:
    runs-on: ubuntu-latest
    name: Init
    outputs:
      output_release_tag: ${{ steps.gen_release_tag.outputs.release_tag }}
      platforms: ${{ steps.read-platforms.outputs.matrix }}
      platforms_source: ${{ steps.read-platforms.outputs.source_matrix_json }}
    steps:
      - name: Generate Tag Name
        id: gen_release_tag
        run: |
          set -e
          echo "release_tag=multi-platform_$(TZ='Asia/Shanghai' date +"%Y.%m.%d_%H.%M.%S")" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}

      - name: Read Platforms From File
        id: read-platforms
        run: |
          set -e
          bash compile_script/platforms.sh


  # ==========================================================================
  # 2. 源码初始化（按源码平台并行）
  # ==========================================================================
  job_source_init:
    needs: job_init
    runs-on: ubuntu-latest
    name: Source-Init-${{ matrix.source_code_platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.job_init.outputs.platforms_source) }}
    env:
      RELEASE_TAG: ${{ needs.job_init.outputs.output_release_tag }}
    steps:
      - name: Init System
        id: init
        run: |
          set -e
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir
          cd /workdir
          mkdir -p output                       # ln -sf 需要目标存在
          ln -sf /workdir/output $GITHUB_WORKSPACE/output
          df -hT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}

      - name: Clone Source Code
        working-directory: /workdir
        run: |
          set -e
          git clone -b ${{ matrix.value.REPO_BRANCH }} --single-branch ${{ matrix.value.REPO_URL }} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Run DIY Part 1 Script
        run: |
          set -e
          chmod +x ${{ matrix.value.DIY_P1_SH }}
          cd openwrt
          $GITHUB_WORKSPACE/${{ matrix.value.DIY_P1_SH }}
          echo "feeds_Conf:------------------------"
          cat feeds.conf.default

      - name: Update Feeds
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -a

      - name: Run DIY Part 2 Script
        env:
          GHFU_GITHUB_TOKEN: ${{ secrets.GHFU_GITHUB_TOKEN }}
        run: |
          set -e
          chmod +x ${{ matrix.value.DIY_P2_SH }}
          cd openwrt
          $GITHUB_WORKSPACE/${{ matrix.value.DIY_P2_SH }}

      - name: Install Feeds
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Run DIY Part 3 scripts
        run: |
          chmod +x $GITHUB_WORKSPACE/${{ matrix.value.DIY_P3_SH }} || true
          cd openwrt
          $GITHUB_WORKSPACE/${{ matrix.value.DIY_P3_SH }}

      - name: Create temporary branch
        run: |
          set -e
          git checkout -b temp-${{ matrix.source_code_platform }}

      - name: Make Defconfig Custom Configuration
        run: |
          set -e
          chmod +x compile_script/step01_make_defconfig.sh
          cd openwrt
          $GITHUB_WORKSPACE/compile_script/step01_make_defconfig.sh "${{ matrix.source_code_platform }}" "${{ matrix.value.CONFIGS }}"

      # ---------------------------------------------------------------
      # 把 CI 改动推回仓库
      #   矩阵并发 → 多 job 同时 push 同一分支必然撞车
      #   策略：失败就重新 fetch + reset --hard origin 对齐基线再 merge 重试
      #
      #   ⚠️ 不要在失败分支里 git reset --hard HEAD~1：
      #      push 失败可能是「已推成功但响应丢失」，盲目回退会削掉别人的提交。
      #      循环顶部那三行已经把基线对齐到远端最新，HEAD~1 没有存在意义。
      # ---------------------------------------------------------------
      - name: Merge and push changes with "theirs" strategy
        run: |
          set -e
          git checkout temp-${{ matrix.source_code_platform }}
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name  "seaks"
          git config user.email "lei.seaks@gmail.com"
          git commit -m "[CI] Configuration: update code for ${{ matrix.source_code_platform }}"

          MAX_RETRIES=${{ env.MAX_PUSH_RETRIES }}
          RETRY_COUNT=0
          TARGET_BRANCH="${{ env.GIT_REF_NAME }}"
          TEMP_BRANCH="temp-${{ matrix.source_code_platform }}"

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            git checkout "$TARGET_BRANCH"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            git merge "$TEMP_BRANCH" --strategy-option theirs \
                      -m "[CI] Merge: $TEMP_BRANCH"

            if git push origin "$TARGET_BRANCH"; then
              echo "Push successful!"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed (attempt $RETRY_COUNT/$MAX_RETRIES). Retrying..."
            sleep $((RANDOM % 5 + 3))       # 随机 3-7 秒错开并发
          done

          if [ "$RETRY_COUNT" -eq "$MAX_RETRIES" ]; then
            echo "Failed to push after $MAX_RETRIES attempts."
            exit 100
          fi

          git branch -D "$TEMP_BRANCH" || echo "Local temp branch not found"

      - name: Generate Source Packages
        working-directory: /workdir
        id: generate_image
        run: |
          set -e
          tar -czf output/output.tar.gz openwrt/
          echo "SOURCE_PATH=$PWD" >> $GITHUB_OUTPUT

      - name: Upload Source To Artifact
        uses: actions/upload-artifact@v7
        if: steps.generate_image.outcome == 'success'
        with:
          name: Source_${{ matrix.source_code_platform }}
          path: ${{ steps.generate_image.outputs.SOURCE_PATH }}/output/output.tar.gz
          overwrite: true
          retention-days: 5

      - name: Generate Git Log
        id: git_log
        run: |
          set -e
          chmod +x compile_script/step03_generate_git_log.sh
          $GITHUB_WORKSPACE/compile_script/step03_generate_git_log.sh "${{ matrix.source_code_platform }}"

      - name: Upload Git Log To Artifact
        uses: actions/upload-artifact@v7
        if: steps.git_log.outcome == 'success'
        with:
          name: git_log_${{ matrix.source_code_platform }}
          path: git_log_${{ matrix.source_code_platform }}.txt
          overwrite: true
          retention-days: 5

      - name: Generate Release Tag
        id: tag
        run: |
          set -e
          chmod +x compile_script/step02_generate_release_tag.sh
          $GITHUB_WORKSPACE/compile_script/step02_generate_release_tag.sh "${{ env.RELEASE_TAG }}" "${{ matrix.source_code_platform }}" "${{ matrix.value.CONFIGS }}"

      - name: Upload Release Tag To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release_${{ matrix.source_code_platform }}
          path: release_${{ matrix.source_code_platform }}.txt
          overwrite: true
          retention-days: 5


  # ==========================================================================
  # 3. 汇总 git log，创建 Release Tag
  # ==========================================================================
  job_generate_release_tag:
    needs: [job_init, job_source_init]
    runs-on: ubuntu-latest
    name: Generate-Release-Tag-And-Git-Log
    env:
      RELEASE_TAG: ${{ needs.job_init.outputs.output_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}
          fetch-depth: 0

      - name: Create temporary branch
        run: |
          set -e
          git checkout -b temp-tag-gitlog

      - name: Download Git Log From Artifacts
        id: download_gitlog
        uses: actions/download-artifact@v8
        with:
          pattern: git_log_*
          merge-multiple: true

      - name: Download Release Tag From Artifacts
        id: download_releasetag
        uses: actions/download-artifact@v8
        with:
          pattern: release_*
          merge-multiple: true

      - name: Generate Release Tag
        id: tag
        run: |
          set -e
          chmod +x compile_script/step06_update_git_log.sh
          $GITHUB_WORKSPACE/compile_script/step06_update_git_log.sh "${{ env.RELEASE_TAG }}"

      - name: Upload Tags To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release_tag
          path: release.txt
          retention-days: 5
          overwrite: true

      - name: Create Release Tag
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release.txt
          make_latest: true

      # 同 job_source_init：失败只重试，不 reset --hard HEAD~1
      - name: Merge and push changes with "theirs" strategy
        run: |
          set -e
          git checkout temp-tag-gitlog
          rm -rf release.txt
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name  "seaks"
          git config user.email "lei.seaks@gmail.com"
          git commit -m "[CI] Git Log: update code"

          MAX_RETRIES=${{ env.MAX_PUSH_RETRIES }}
          RETRY_COUNT=0
          TARGET_BRANCH="${{ env.GIT_REF_NAME }}"

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            git checkout "$TARGET_BRANCH"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            git merge temp-tag-gitlog --strategy-option theirs --no-edit

            if git push origin "$TARGET_BRANCH"; then
              echo "Push successful!"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed (attempt $RETRY_COUNT/$MAX_RETRIES). Retrying..."
            sleep $((RANDOM % 5 + 3))
          done

          if [ "$RETRY_COUNT" -eq "$MAX_RETRIES" ]; then
            echo "Failed to push git log after $MAX_RETRIES attempts."
            exit 100
          fi

          git branch -D temp-tag-gitlog || echo "Local temp-tag-gitlog not found"


  # ==========================================================================
  # 4. 编译与上传（源码平台 × 固件平台 并行）
  #
  #    matrix_status 是重试机制核心：本 job 若已在重试中成功过就直接跳过
  #    下面每个 step 都带同一个 if —— 这是故意展开写的，不用 YAML 锚点：
  #    env 块里无法引用 steps 上下文
  # ==========================================================================
  job_compile_and_upload:
    needs: [job_init, job_source_init, job_generate_release_tag]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.job_source_init.result == 'success' && needs.job_generate_release_tag.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.job_init.outputs.platforms) }}
    name: Build-${{ matrix.source_code_platform }}-${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ needs.job_init.outputs.output_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}

      - name: Matrix Status
        id: matrix_status
        run: |
          set -e
          chmod +x compile_script/matrix_job_status.sh
          $GITHUB_WORKSPACE/compile_script/matrix_job_status.sh "${{ github.token }}" "${{ github.repository }}" "${{ github.run_id }}" "${{ fromJSON(github.run_attempt) }}" "Build-${{ matrix.source_code_platform }}-${{ matrix.platform }}"

      - name: Server Info
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          echo "---------------------CPU Info--------------------"
          lscpu
          echo "---------------------RAM Info--------------------"
          free -h

      - name: Initialization Environment
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir
          df -hT

      - name: Free Disk Space
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          echo "==== Disk space before cleanup ===="
          df -hT
          echo "==== Clean disk space begin ===="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "==== Clean disk space complete ===="
          df -hT

      # ---------------------------------------------------------------
      # 安装编译依赖
      #   不用 sudo -E：runner 的 sudoers 有 env_reset，-E 会被忽略并刷警告
      #   改成在 sudo 命令行上显式传 DEBIAN_FRONTEND（只禁继承全部，不禁指定个别）
      #
      #   curl 退出码用 set +e / set -e 夹住捕获；判断时加引号，
      #   否则 DEP_RC 万一为空会变成 "[ -ne 0 ]" → unary operator expected，
      #   连下面的错误提示都打印不出来
      #
      #   diy_script/<platform>_dependence 必须存在（无扩展名），
      #   少一个文件就是 404，这里会明确报出来而不是静默装空
      # ---------------------------------------------------------------
      - name: Install Packages
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          DEP_URL="https://github.com/seaks/OpenWrtAction/raw/main/diy_script/${{ matrix.source_code_platform }}_dependence"
          set +e
          DEP_LIST=$(curl -fsSL "$DEP_URL")
          DEP_RC=$?
          set -e
          if [ "$DEP_RC" -ne 0 ] || [ -z "$DEP_LIST" ]; then
            echo "!!! 获取依赖清单失败 (rc=$DEP_RC)，平台：${{ matrix.source_code_platform }}" >&2
            exit 1
          fi
          echo "---- 待装依赖 ----"
          echo "$DEP_LIST"
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            $DEP_LIST

      - name: Initialization Directory
        working-directory: /workdir
        id: init_directory
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          mkdir -p openwrt download
          ln -sf /workdir/openwrt   $GITHUB_WORKSPACE/openwrt
          ln -sf /workdir/download $GITHUB_WORKSPACE/download

      # Docker 数据目录迁到 /workdir：根分区仅 ~14GB，装不下缓存镜像
      - name: Relocate Docker to /workdir
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          echo "==== 1. 停止 Docker 服务 ===="
          sudo systemctl stop docker
          echo "==== 2. 迁移数据目录到 /workdir ===="
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          echo "==== 3. 重启 Docker 服务 ===="
          sudo systemctl start docker
          echo "==== 4. 验证 ===="
          docker info | grep "Docker Root Dir"

      - name: Login to GitHub Container Registry
        if: steps.matrix_status.outputs.status != 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download Source From Artifacts
        id: download
        if: steps.matrix_status.outputs.status != 'success'
        uses: actions/download-artifact@v8
        with:
          name: Source_${{ matrix.source_code_platform }}
          path: download

      - name: Extract Pristine Source
        if: steps.matrix_status.outputs.status != 'success'
        working-directory: /workdir
        run: |
          set -e
          tar -xzf download/output.tar.gz
          rm -rf download/output.tar.gz
          sudo chown -R $USER:$GROUPS /workdir/openwrt

      - name: Load Configuration
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          [ -e "${{ matrix.value.CONFIGS }}/${{ matrix.platform }}.config" ] && \
            cp -r "${{ matrix.value.CONFIGS }}/${{ matrix.platform }}.config" openwrt/.config
          cd openwrt
          make defconfig

      # ---------------------------------------------------------------
      # 时间戳还原
      #   artifact 打包会把 mtime 全冲成当下，make 靠 mtime 判断要不要重编
      #   1) 用 git log 把每个文件 mtime 还原成最后提交时间
      #   2) dl/ 一律回拨 2000-01-01：make download 会刷新 tarball mtime，
      #      比 stamp 新就触发重编；回拨到远古即免疫
      #      （PKG_HASH 真变了 stamp 名也变，照样正常重编）
      # ---------------------------------------------------------------
      - name: Git Restore Mtime (True SSoT) And DL Restore Time
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          cd /workdir/openwrt
          echo "==== 遍历所有 Git 仓库并精准还原真实提交时间 ===="
          find . -name ".git" -type d | while read -r gitdir; do
              repo_dir=$(dirname "$gitdir")
              echo "-> 正在处理 Git 仓库: $repo_dir"
              # 子 shell：cd 不污染外层循环
              (
                cd "/workdir/openwrt/$repo_dir" || exit 0
                git log --format=%at --name-only | perl -ane '
                  if (/^(\d+)$/) { $t = $1; }
                  elsif (/^(\S+)$/) {
                    $f = $1;
                    if (-e $f && !-d $f && !$seen{$f}) {
                      utime($t, $t, $f);
                      $seen{$f} = 1;
                    }
                  }'
              )
          done

          find /workdir/openwrt/dl -type f -print0 2>/dev/null | \
            xargs -0 -r touch -t 200001010000
          echo "✅ dl/ 时间戳逆转完成！"

      # ---------------------------------------------------------------
      # 从 GHCR 恢复整个编译缓存
      #
      #   Checkpoint 时 COPY layerN / 会把层内文件平铺到镜像根目录，
      #   所以 export 出来的 tar 里分块直接位于 / 下，无需递归查找
      #
      #   split 切的是「tar | zstd」的单个压缩流，cat 拼回仍是同一个流，
      #   因此 tar -I zstd 可直接解（不是 docker save 那种分层独立压缩）
      #
      #   pipefail：tar 解失败时不能继续 rm 掉分块，保留现场便于排查
      # ---------------------------------------------------------------
      - name: Restore Entire OpenWrt Cache from GHCR
        id: restore_cache
        if: steps.matrix_status.outputs.status != 'success' && fromJSON(github.run_attempt) < 3 && github.event.inputs.force_rebuild != 'true'
        run: |
          set -eo pipefail
          df -hT

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PLATFORM_NAME=$(echo "${{ matrix.source_code_platform }}-${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/openwrt-base-cache-${PLATFORM_NAME}:latest"

          if ! docker pull "$IMAGE_NAME"; then
            echo "No cache found on GHCR. This will be a clean build."
            df -hT
            exit 0
          fi

          echo "==== 发现缓存，开始提取 ===="
          cd /workdir

          docker create --name cache_container "$IMAGE_NAME" /bin/true
          docker export cache_container > cache_exported.tar
          docker rm -f cache_container
          docker rmi -f "$IMAGE_NAME"

          # 分块平铺在镜像根目录，直接提取
          tar -xf cache_exported.tar --wildcards "op_cache_raw_*"
          rm -f cache_exported.tar

          # 按版本号排序，保证分块顺序正确；屏蔽无文件时的冗余报错
          mapfile -t PARTS < <(ls -1 op_cache_raw_* 2>/dev/null | sort -V)

          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "⚠️ 未找到有效缓存分块，转入 clean build"
          else
            echo "==== 合并 ${#PARTS[@]} 个分块并还原到源码树 ===="
            cat "${PARTS[@]}" | tar -I "zstd -T0" -xf - -C /workdir/openwrt/
            rm -f op_cache_raw_*
            echo "✅ 缓存恢复完成！"
          fi

          df -hT

      - name: SSH connection to Actions
        uses: owenthereal/action-upterm@v2
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')

      # ---------------------------------------------------------------
      # 阶段一：编译 Base（tools / toolchain）
      #
      #   ⚠️ download 必须 -j1：
      #      tools/toolchain 的源站（kernel.org / gnu.org / GitHub）会限流，
      #      并发拉取容易 429 导致整个 make 失败；这一步瓶颈是带宽不是 CPU，
      #      串行省不了多少时间，但稳定性差别很大
      #
      #   第 3 次尝试开 V=s 输出详细日志
      # ---------------------------------------------------------------
      - name: Compile Base (Tools, Toolchain)
        id: compile_base
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          set -e
          cd openwrt
          touch /workdir/base_compilation_marker

          LONG_TIME_TARGETS_DOWNLOAD=(
              "tools/download"
              "toolchain/download"
          )
          echo "==== 开始 download ===="
          for target in "${LONG_TIME_TARGETS_DOWNLOAD[@]}"; do
              echo "==== 正在执行 download $target ===="
              make "$target" -j1 || exit 1
              sleep 5
              echo "------------------------"
          done

          LONG_TIME_TARGETS_COMPILE=(
              "tools/compile"
              "toolchain/compile"
          )

          VERBOSE=""
          if [[ ${{ fromJSON(github.run_attempt) }} == 3 ]]; then
              VERBOSE="V=s"
          fi

          echo "==== 开始编译 ===="
          for target in "${LONG_TIME_TARGETS_COMPILE[@]}"; do
              echo "==== 正在执行 compile $target $VERBOSE ===="
              time make "$target" -j$(nproc) $VERBOSE || exit 1
              sleep 5
              echo "------------------------"
          done

      # ---------------------------------------------------------------
      # Checkpoint：Base 有变化就推新缓存到 GHCR
      #   探测：找比 marker 新的 stamp，忽略每次必变但无复用价值的
      #   推送：tar | zstd | split 切 5GB，每块一个 layer 绕开 Artifact 限制
      #
      #   实测两种输出都健康：
      #     没变 → "🎉 Found 0 newer stamp files"
      #     变了 → "⚡ 检测到 N 个新 stamp" + "✅ 分块多层缓存推送完毕"
      # ---------------------------------------------------------------
      - name: Checkpoint Cache (Save Base to GHCR)
        if: steps.matrix_status.outputs.status != 'success' && steps.compile_base.outcome == 'success'
        run: |
          set -e
          echo "==== 智能探测 Base 是否更新 ===="
          cd /workdir

          IGNORE_PATTERN="staging_dir/host/stamp/\.tools_compile_|staging_dir/target-[^/]+/stamp/\.target_prereq$|staging_dir/host/stamp/\.(zstd|flock|libdeflate|pkgconf|xz|tar|patch|m4)_"

          CHANGED_STAMPS=$(find openwrt/build_dir openwrt/staging_dir -type f \
                            -newer /workdir/base_compilation_marker \
                            -path "*/stamp/*" 2>/dev/null | \
                            grep -E -v "$IGNORE_PATTERN" || true)

          CHANGED_BASE=$(echo "$CHANGED_STAMPS" | grep -c . || true)
          echo "--- Found $CHANGED_BASE newer stamp files ---"

          if [ "$CHANGED_BASE" -eq 0 ]; then
              echo "🎉 Base 阶段命中旧缓存，跳过本次 Checkpoint 存档！"
              exit 0
          fi

          echo "$CHANGED_STAMPS"

          echo "==== 回拨 dl/ 时间戳 ===="
          find /workdir/openwrt/dl -type f -print0 2>/dev/null | \
            xargs -0 -r touch -t 200001010000
          echo "✅ dl/ 时间戳逆转完成！"

          echo "⚡ 检测到 $CHANGED_BASE 个新 stamp，触发缓存更新存档..."
          df -hT

          echo "==== 自动修剪冗余版本 ===="
          for linux_dir in openwrt/build_dir/target-*/linux-*/; do
              [ -d "$linux_dir" ] && \
                (cd "$linux_dir" && ls -dt linux-* 2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
          done
          [ -d "openwrt/build_dir" ] && \
            (cd openwrt/build_dir && ls -dt toolchain-* 2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
          if [ -d "openwrt/staging_dir" ]; then
              (cd openwrt/staging_dir && ls -dt target-*   2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
              (cd openwrt/staging_dir && ls -dt toolchain-* 2>/dev/null | tail -n +2 | xargs -r -I {} rm -rf "{}")
          fi

          echo "==== 打包与 5GB 分块 ===="
          cd /workdir/openwrt
          tar -I "zstd -T0 -10" -cf - build_dir staging_dir dl 2>/dev/null | \
            split -a 3 -d -b 5000M - /workdir/op_cache_raw_

          echo "==== 创建 Layer 隔离目录 ===="
          cd /workdir
          echo "FROM scratch" > Dockerfile
          count=1
          for f in op_cache_raw_*; do
              layer_dir="layer$count"
              mkdir -p "$layer_dir"
              mv "$f" "$layer_dir/"          # 分块移入 layer 目录，COPY 后平铺到镜像根
              echo "COPY $layer_dir /" >> Dockerfile
              count=$((count + 1))
          done

          echo "==== 构建并推送多层镜像 ===="
          df -hT
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PLATFORM_NAME=$(echo "${{ matrix.source_code_platform }}-${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/openwrt-base-cache-${PLATFORM_NAME}:latest"

          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
          echo "✅ 分块多层缓存推送完毕！"

          echo "==== 清理临时数据 ===="
          rm -rf layer* Dockerfile
          docker rmi -f "$IMAGE_NAME" || true
          # system prune -a 已包含 builder / image prune，一条就够
          docker system prune -a -f || true
          echo "✅ 清理完成！"
          df -hT

      # ---------------------------------------------------------------
      # 下载源码包
      #   timeout 超时退出码 124，不区分的话日志里看不出是超时还是真失败
      # ---------------------------------------------------------------
      - name: Download Package
        continue-on-error: true
        if: steps.matrix_status.outputs.status != 'success' && !cancelled()
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/openwrt"
          timeout 25m make download -j8 2>&1 | tee download.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -eq 124 ]; then
              echo "⚠️ make download 超时（25m），已下载 $(find dl -type f | wc -l) 个文件"
              echo "   编译阶段可能因缺源码失败，可增大 timeout 或调小 -j"
          elif [ "$RC" -ne 0 ]; then
              echo "⚠️ make download 退出码 $RC，尾部日志："
              tail -30 download.log
          else
              echo "✅ make download 完成，共 $(find dl -type f | wc -l) 个文件"
          fi
          exit 0

      # ---------------------------------------------------------------
      # 阶段二：编译全部包与固件
      #   第 3 次尝试开 V=s；失败自动 tail 日志，不用手点折叠区
      # ---------------------------------------------------------------
      - name: Compile Packages and Firmware
        id: compile
        if: steps.matrix_status.outputs.status != 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt
          df -h

          # rustdesk-server 只在 openwrt 官方源这条线装
          if [[ "${{ matrix.source_code_platform }}" == "openwrt" ]]; then
            chmod +x "$GITHUB_WORKSPACE/${{ matrix.value.DIY_P4_SH }}" || true
            # shellcheck disable=SC1090
            source "$GITHUB_WORKSPACE/${{ matrix.value.DIY_P4_SH }}"
            install_rustdesk_server
          fi

          VERBOSE=""
          if [[ ${{ fromJSON(github.run_attempt) }} == 3 ]]; then
              VERBOSE="V=s"
          fi

          set -o pipefail
          make -j$(nproc) $VERBOSE 2>&1 | tee compile.log
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
              echo "==== make 失败，退出码 $RC，最后 60 行 ===="
              tail -60 compile.log
          fi
          exit "$RC"

      # ---------------------------------------------------------------
      # 整理固件：加平台前缀，避免同 Release 内同名覆盖
      #
      #   ⚠️ 不要写 cd bin/targets/*/* ：
      #      多平台并行时该 glob 可能展开成多个目录 → cd 报 too many arguments；
      #      无匹配时拿到字面量 → cd 失败。先接住再判目录
      #
      #   feeds_packages 的处理：目录保留下来随 Release / Artifact 上传，
      #   但其内容不塞进 buildinfo zip —— 否则几百 MB ipk 会被压两遍
      # ---------------------------------------------------------------
      - name: Organize Files
        id: organize
        if: steps.compile.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          set -e
          PREFIX="${{ matrix.platform }}"
          SRC_PLATFORM="${{ matrix.source_code_platform }}"
          echo "==== platform=$PREFIX  source=$SRC_PLATFORM ===="

          TARGET_DIR=$(echo "$GITHUB_WORKSPACE/openwrt/bin/targets/"*/*)
          if [ ! -d "$TARGET_DIR" ]; then
            echo "!!! 找不到固件目录：$TARGET_DIR" >&2
            ls -la "$GITHUB_WORKSPACE/openwrt/bin/targets/" || true
            exit 1
          fi
          cd "$TARGET_DIR"
          firmware_path="$PWD"
          echo "==== firmware_path=$firmware_path ===="
          echo "---- 原始文件列表 ----"
          ls -la

          mkdir -p feeds_packages
          cp -r "$GITHUB_WORKSPACE/openwrt/bin/packages/"*/* "$firmware_path/feeds_packages/" 2>/dev/null || true
          cd "$firmware_path"

          # 只要固件，不要独立 rootfs / kernel
          rm -f *rootfs*.img.gz
          rm -f *kernel*.bin

          # 已带前缀的跳过，保证可重复执行
          add_prefix() {
            local pattern="$1" f
            for f in $pattern; do
              [ -e "$f" ] || continue
              [ -f "$f" ] || continue
              case "$f" in
                "${PREFIX}_"*) echo "skip (already prefixed): $f" ;;
                *) mv -v "$f" "${PREFIX}_$f" ;;
              esac
            done
          }

          add_prefix 'immortalwrt-*'
          add_prefix 'openwrt-*'
          add_prefix 'lede-*'

          for f in sha256sums version.buildinfo config.buildinfo feeds.buildinfo *.manifest; do
            add_prefix "$f"
          done

          # lede 源额外把 openwrt- 改成 lede-（在前缀之后，避免双前缀）
          if [[ "$SRC_PLATFORM" == "lede" ]]; then
            for file in openwrt-*; do
              [ -f "$file" ] || continue
              mv -v "$file" "${file/openwrt-/lede-}"
            done
          fi

          # zip 只收固件与 buildinfo；-x 排除 feeds_packages
          ZIPNAME="buildinfo_${SRC_PLATFORM}_${PREFIX}.zip"
          zip -r "$ZIPNAME" */ -x 'feeds_packages/*' || true
          find . -maxdepth 1 -type f ! -name '*-*-*' ! -name '*.zip' -exec zip "$ZIPNAME" {} +

          # 清理中间产物，但保留：带前缀的固件(*-*-*)、zip、feeds_packages/
          find . -mindepth 1 ! \( -name '*-*-*' -o -name '*.zip' -o -name 'feeds_packages' \) -exec rm -rf {} +

          echo "---- 重命名后文件列表 ----"
          ls -la
          echo "FIRMWARE=$firmware_path" >> "$GITHUB_OUTPUT"

      - name: Upload Firmware To Release Directly
        if: steps.organize.outcome == 'success' && !cancelled()
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.organize.outputs.FIRMWARE }}/*

      - name: Upload Firmware Directory To Artifact (Backup)
        uses: actions/upload-artifact@v7
        if: steps.organize.outcome == 'success' && env.UPLOAD_ARTIFACT == 'true' && !cancelled()
        with:
          name: ${{ matrix.source_code_platform }}_${{ matrix.platform }}_firmware
          path: ${{ steps.organize.outputs.FIRMWARE }}
          overwrite: true

      - name: Upload Bin Directory To Artifact (Backup)
        uses: actions/upload-artifact@v7
        if: steps.compile.outcome == 'success' && env.UPLOAD_BIN_DIR == 'true' && !cancelled()
        with:
          name: OpenWrt_bin_${{ matrix.source_code_platform }}_${{ matrix.platform }}
          path: openwrt/bin
          overwrite: true


  # ==========================================================================
  # 5. 整理 Release 正文与 tag
  # ==========================================================================
  job_organize_tags:
    needs: [job_init, job_source_init, job_generate_release_tag, job_compile_and_upload]
    if: ${{ !cancelled() && needs.job_source_init.result == 'success' && needs.job_generate_release_tag.result == 'success' }}
    runs-on: ubuntu-latest
    name: Organize-Release-Tags
    outputs:
      output_tag_status: ${{ steps.organize_tags.outputs.status }}
    env:
      RELEASE_TAG: ${{ needs.job_init.outputs.output_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF_NAME }}

      - name: Pull the latest changes
        run: |
          set -e
          git pull origin ${{ env.GIT_REF_NAME }}

      - name: Download Tags
        uses: actions/download-artifact@v8
        with:
          name: release_tag

      - name: Organize Tags
        id: organize_tags
        run: |
          set -e
          chmod +x compile_script/step07_organize_tag.sh
          $GITHUB_WORKSPACE/compile_script/step07_organize_tag.sh "${{ github.token }}" "${{ github.repository }}" "${{ github.run_id }}" "${{ fromJSON(github.run_attempt) }}" "3"

      - name: Upload Tags To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release_tag
          path: release.txt
          retention-days: 5
          overwrite: true

      - name: Update Release Tag
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release.txt


  # ==========================================================================
  # 6. 收尾
  # ==========================================================================
  rerun-failed-jobs:
    runs-on: ubuntu-latest
    needs: [job_init, job_source_init, job_generate_release_tag, job_compile_and_upload, job_organize_tags]
    if: failure() && fromJSON(github.run_attempt) < 3 && !cancelled()
    steps:
      - name: Rerun failed jobs in the current workflow
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Retry failed jobs for the ${{ fromJSON(github.run_attempt) }} time, Retry 3 times in total"
          gh workflow run Retry_Failure_Jobs.yml -F run_id=${{ github.run_id }}

  final-execution-jobs:
    runs-on: ubuntu-latest
    needs: [rerun-failed-jobs, job_organize_tags]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Trigger Release Update
        if: ${{ needs.rerun-failed-jobs.result == 'skipped' && fromJSON(github.run_attempt) < 4 }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.MY_SECRET_PAT }}
          repository: seaks/OpenWrtAction
          event-type: openwrt_compilation_completed
